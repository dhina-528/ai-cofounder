<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Icon -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0E1526" stroke="#1E2942" stroke-width="1.5" />
  
  <!-- Neural Link Hex / Star / Co-founder Wings -->
  <path d="M20 7L24 16L33 20L24 24L20 33L16 24L7 20L16 16L20 7Z" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.9" />
  
  <!-- Inner Core Nucleus -->
  <circle cx="20" cy="20" r="3.5" fill="url(#sparkleGrad)" />
  <circle cx="20" cy="20" r="6" stroke="#22D3EE" stroke-width="1" opacity="0.6" stroke-dasharray="2 2" />
</svg>
